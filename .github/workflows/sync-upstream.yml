# Keeps this fork on the newest official Narratarr release, with the phone fix on top.
#
# Every 6 hours: if narratarr/narratarr has published a newer release tag (v1.2.3), merge it
# into main, build a fresh Docker image (ghcr.io/<you>/narratarr:latest), and publish a
# release on this fork with Narratarr's notes plus what the fork adds.
# The fix lives in its own files, so releases merge in cleanly. If one ever can't merge,
# this run fails, GitHub emails you, and main is left exactly as it was.
#
# GitHub doesn't let this workflow's own token push a release that changes Narratarr's
# workflow files (.github/workflows). With a SYNC_TOKEN secret (a fine-grained token with
# Contents + Workflows write on this repo) those releases go through too. Without one,
# such a release fails the run once (one email, saying what to do) and then waits
# quietly, instead of failing every 6 hours.
# Run it by hand any time: Actions tab -> "Sync with upstream releases" -> Run workflow.

name: Sync with upstream releases

on:
  schedule:
    - cron: "41 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency: sync-upstream

jobs:
  sync:
    if: github.repository != 'narratarr/narratarr'
    runs-on: ubuntu-latest
    env:
      HAS_SYNC_TOKEN: ${{ secrets.SYNC_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN || github.token }}

      - name: Merge the newest upstream release
        id: merge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/narratarr/narratarr.git
          git fetch --quiet --no-tags upstream "+refs/tags/v*:refs/tags/upstream/v*"
          latest=$(git tag -l 'upstream/v*' --sort=-v:refname | head -n 1)
          if [ -z "$latest" ]; then echo "No upstream releases found."; exit 0; fi
          echo "Newest upstream release: ${latest#upstream/}"
          echo "latest=${latest#upstream/}" >> "$GITHUB_OUTPUT"
          if git merge-base --is-ancestor "$latest" HEAD; then
            echo "Already up to date."
            exit 0
          fi
          if ! git merge --no-edit -m "Merge Narratarr ${latest#upstream/} from upstream" "$latest"; then
            git merge --abort
            echo "::error::Narratarr ${latest#upstream/} conflicts with the phone fix. Nothing was changed."
            exit 1
          fi
          # Note the merge in FORK-CHANGELOG.md (only this fork has that file, so it never conflicts).
          if [ -f FORK-CHANGELOG.md ]; then
            python3 - "${latest#upstream/}" <<'PY'
          import sys, datetime, pathlib
          p = pathlib.Path("FORK-CHANGELOG.md"); s = p.read_text()
          mark = "<!-- sync-upstream adds a line below for every release it merges -->"
          line = f"- {datetime.date.today():%Y-%m-%d}: merged Narratarr **{sys.argv[1]}**"
          if mark in s and f"**{sys.argv[1]}**" not in s:
              p.write_text(s.replace(mark, mark + "\n" + line, 1))
          PY
            git add FORK-CHANGELOG.md
            git diff --cached --quiet || git commit -m "Fork changelog: merged Narratarr ${latest#upstream/}"
          fi
          if ! git push origin HEAD:main 2> push.log; then
            cat push.log
            if grep -q "workflows. permission" push.log; then
              echo "needs_token=${latest#upstream/}" >> "$GITHUB_OUTPUT"
              echo "::warning::Narratarr ${latest#upstream/} changes GitHub workflow files, which this token can't push. Opening an issue with what to do."
              exit 0
            fi
            exit 1
          fi
          cat push.log
          echo "updated=${latest#upstream/}" >> "$GITHUB_OUTPUT"

      # A push made with this workflow's own token doesn't start other workflows, so ask for the image.
      # (A push made with SYNC_TOKEN starts the build by itself.)
      - name: Build the new image
        if: steps.merge.outputs.updated != '' && env.HAS_SYNC_TOKEN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run docker.yml --ref main --repo "${{ github.repository }}"

      # Also catches up: any synced version without a release (say, the first one) gets one.
      - name: Publish a release with the notes
        if: steps.merge.outputs.latest != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.merge.outputs.latest }}
        run: |
          if gh release view "fork-$VERSION" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release fork-$VERSION already exists."; exit 0
          fi
          python3 .github/fork-release-notes.py "$VERSION" > release-notes.md
          gh release create "fork-$VERSION" --repo "${{ github.repository }}" --target "$(git rev-parse HEAD)" \
            --title "Narratarr ${VERSION#v} + phone fix" --notes-file release-notes.md --latest

      - name: Say once that this release needs a hand
        if: steps.merge.outputs.needs_token != ''
        env:
          VERSION: ${{ steps.merge.outputs.needs_token }}
        run: |
          # A tag marks that this release was already reported, so the next runs stay quiet.
          tag="needs-manual-sync-$VERSION"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "Already reported Narratarr $VERSION. Waiting for a manual sync; nothing changed."
            exit 0
          fi
          git tag "$tag" "$(git rev-parse origin/main)"
          git push origin "refs/tags/$tag"
          echo "::error::Narratarr $VERSION changes GitHub workflow files, so it can't be synced automatically. Nothing changed: the fork and your server stay on the previous version. Fix: on the fork's main page click Sync fork → Update branch (never Discard commits), or ask Claude. To make these automatic, add a SYNC_TOKEN secret (fine-grained token, this repo only, Contents + Workflows read/write)."
          exit 1
